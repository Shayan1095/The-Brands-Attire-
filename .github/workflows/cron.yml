# Runs the store's scheduled job every hour: order reminders and auto-cancel, bag reminders, the agents,
# loyalty messages and the message queue. Vercel's daily cron (vercel.json) stays as a backup.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SITE_URL     the live address, e.g. https://thebrandsattire.com (no trailing slash)
#   CRON_SECRET  the same value as CRON_SECRET on Vercel
name: Scheduled job

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-job
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set the SITE_URL and CRON_SECRET repository secrets first."
            exit 1
          fi
          code=$(curl -sS -o response.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" "${SITE_URL%/}/api/cron")
          echo "HTTP $code"
          head -c 2000 response.json; echo
          if [ "$code" != "200" ]; then
            echo "The scheduled job did not succeed."
            exit 1
          fi
